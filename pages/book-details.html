<!DOCTYPE html>
{% load static %}
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বইয়ের বিবরণ — গ্রন্থ সেতু | সেতু</title>
  <meta name="description" content="বইয়ের বিষয়, লেখক, ধার নেওয়ার সময়সীমা ও বিনিময় শর্তের বিবরণ।">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/components.css' %}">
  <link rel="stylesheet" href="{% static 'css/responsive.css' %}">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <nav class="navbar" aria-label="প্রধান নেভিগেশন">
        <a href="{% url 'home' %}" class="brand-logo">
          <div class="brand-icon">🌉</div>
          <div>
            <span>সেতু</span>
            <span class="brand-tagline">বইয়ের বিবরণ</span>
          </div>
        </a>

        <ul class="nav-links">
          <li><a href="{% url 'home' %}" class="nav-link">হোম</a></li>
          <li><a href="{% url 'food' %}" class="nav-link">🍱 আহার সেতু</a></li>
          <li><a href="{% url 'clothes' %}" class="nav-link">👕 বস্ত্র সেতু</a></li>
          <li><a href="{% url 'books' %}" class="nav-link active">📚 গ্রন্থ সেতু</a></li>
          <li><a href="{% url 'volunteers' %}" class="nav-link">স্বেচ্ছাসেবক</a></li>
          <li><a href="{% url 'about' %}" class="nav-link">আমাদের সম্পর্কে</a></li>
        </ul>

        <div class="nav-actions">
          <a href="{% url 'notifications' %}" class="nav-notification-btn" aria-label="বিজ্ঞপ্তি">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="notification-pill">২</span>
          </a>

          <div class="auth-buttons" style="display: flex; gap: 0.5rem;">
            <a href="{% url 'login' %}" class="btn btn-outline btn-sm">লগইন</a>
            <a href="{% url 'register' %}" class="btn btn-primary btn-sm">নিবন্ধন</a>
          </div>

          <button class="mobile-menu-btn" aria-label="মেনু খুলুন">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <!-- Breadcrumbs -->
  <div style="background: var(--bg-surface); border-bottom: 1px solid var(--border-light); padding: 0.75rem 0;">
    <div class="container">
      <div style="font-size: 0.88rem; color: var(--text-subtle); display:flex; gap:0.5rem; align-items:center;">
        <a href="{% url 'home' %}">হোম</a>
        <span>›</span>
        <a href="{% url 'books' %}">গ্রন্থ সেতু</a>
        <span>›</span>
        <span style="color: var(--text-main); font-weight:600;">বইয়ের বিবরণ</span>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <main class="container" style="padding-top: 2.5rem; padding-bottom: 4rem;">
    <!-- Injected dynamically by books.js based on ?id= -->
    <div id="bookDetailsContainer">
      <div class="skeleton-card" style="padding: 2rem;">
        <div class="skeleton skeleton-img" style="height: 300px;"></div>
        <div class="skeleton skeleton-title" style="margin-top: 1rem;"></div>
        <div class="skeleton skeleton-text"></div>
      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© ২০২৬ সেতু। সর্বস্বত্ব সংরক্ষিত।</div>
        <div>গ্রন্থ সেতু — জ্ঞান কোনো সীমানায় আটকে থাকে না।</div>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="{% static 'js/data.js' %}"></script>
  <script src="{% static 'js/main.js' %}"></script>
  <script src="{% static 'js/books.js' %}"></script>
</body>
</html>
