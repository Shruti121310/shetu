<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লগইন — সেতু | সামাজিক সেতুবন্ধন</title>
  <meta name="description" content="সেতু প্ল্যাটফর্মে লগইন করুন। খাবার, পোশাক ও বই শেয়ার করতে আজই সংযুক্ত হন।">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--primary-surface) 0%, #fff 50%, var(--secondary-subtle) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-card {
      background: var(--bg-surface);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      width: 100%;
      max-width: 440px;
      padding: 2.5rem;
      border: 1px solid var(--border-light);
    }
    .auth-brand {
      text-align: center;
      margin-bottom: 2rem;
    }
    .auth-brand-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 0.5rem;
    }
    .auth-brand h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      margin: 0 0 0.25rem;
    }
    .auth-brand p {
      color: var(--text-subtle);
      font-size: 0.9rem;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--text-light);
      font-size: 0.875rem;
    }
    .auth-divider::before,
    .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }
    .social-login-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.7rem 1.25rem;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      background: var(--bg-surface);
      color: var(--text-main);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 0.75rem;
    }
    .social-login-btn:hover {
      background: var(--bg-subtle);
      border-color: var(--border-focus);
      transform: translateY(-1px);
    }
    .form-group {
      margin-bottom: 1.1rem;
    }
    .form-label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }
    .form-input {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid var(--border-light);
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      background: var(--bg-surface);
      transition: border-color 0.2s, box-shadow 0.2s;
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
    }
    .form-row-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.875rem;
      color: var(--text-muted);
      cursor: pointer;
    }
    .forgot-link {
      font-size: 0.875rem;
      color: var(--primary);
      text-decoration: none;
    }
    .forgot-link:hover { text-decoration: underline; }
    .auth-footer-text {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--text-subtle);
    }
    .auth-footer-text a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .auth-footer-text a:hover { text-decoration: underline; }
    .input-group {
      position: relative;
    }
    .input-eye-btn {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-subtle);
      padding: 0.25rem;
    }
    .input-eye-btn:hover { color: var(--text-muted); }
    .home-nav-link {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-subtle);
      text-decoration: none;
      margin-bottom: 1rem;
      width: fit-content;
    }
    .home-nav-link:hover { color: var(--primary); }
  </style>
</head>
<body>

  <div class="auth-page">
    <div class="auth-card">
      <a href="../index.html" class="home-nav-link">
        ← হোমপেজে ফিরুন
      </a>

      <div class="auth-brand">
        <span class="auth-brand-icon">🌉</span>
        <h1>সেতু-তে স্বাগতম</h1>
        <p>আপনার অ্যাকাউন্টে প্রবেশ করুন</p>
      </div>

      <!-- Social Login -->
      <button class="social-login-btn" onclick="showToastDemo('গুগল লগইন শীঘ্রই আসছে!')">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        গুগল দিয়ে লগইন করুন
      </button>

      <div class="auth-divider">অথবা ইমেইল দিয়ে</div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="loginEmail">ইমেইল ঠিকানা</label>
          <input type="email" id="loginEmail" class="form-input" placeholder="আপনার ইমেইল লিখুন" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">পাসওয়ার্ড</label>
          <div class="input-group">
            <input type="password" id="loginPassword" class="form-input" placeholder="পাসওয়ার্ড লিখুন" required autocomplete="current-password" style="padding-right: 2.75rem;">
            <button type="button" class="input-eye-btn" onclick="togglePassword('loginPassword', this)" aria-label="পাসওয়ার্ড দেখুন">
              👁
            </button>
          </div>
        </div>

        <div class="form-row-flex">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe"> মনে রাখুন
          </label>
          <a href="#" class="forgot-link">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; font-size:1rem; padding: 0.8rem;" id="loginBtn">
          লগইন করুন
        </button>
      </form>

      <div class="auth-footer-text">
        নতুন ব্যবহারকারী? <a href="register.html">এখনই নিবন্ধন করুন</a>
      </div>

      <!-- Demo hint -->
      <div style="margin-top:1.25rem; padding:0.85rem 1rem; background:var(--primary-surface); border-radius:var(--radius-md); border-left: 3px solid var(--primary); font-size:0.825rem; color: var(--text-muted);">
        <strong>ডেমো লগইন:</strong><br>
        ইমেইল: demo@shetu.bd<br>
        পাসওয়ার্ড: shetu2026
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="../js/data.js"></script>
  <script src="../js/main.js"></script>
  <script>
    function togglePassword(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === 'password') {
        input.type = 'text';
        btn.textContent = '🙈';
      } else {
        input.type = 'password';
        btn.textContent = '👁';
      }
    }

    function showToastDemo(msg) {
      showToast && showToast(msg, 'info');
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      const btn = document.getElementById('loginBtn');

      btn.textContent = 'যাচাই হচ্ছে...';
      btn.disabled = true;

      setTimeout(() => {
        if (email === 'demo@shetu.bd' && password === 'shetu2026') {
          showToast && showToast('সফলভাবে লগইন হয়েছে! ড্যাশবোর্ডে নিয়ে যাচ্ছে...', 'success');
          setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
        } else {
          showToast && showToast('ইমেইল বা পাসওয়ার্ড ভুল। ডেমো তথ্য ব্যবহার করুন।', 'error');
          btn.textContent = 'লগইন করুন';
          btn.disabled = false;
        }
      }, 1000);
    }
  </script>
</body>
</html>
